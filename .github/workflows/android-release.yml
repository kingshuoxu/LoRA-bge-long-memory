name: Android release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/android-milestone-1-d325
    paths:
      - "android/**"
      - "experts/**"
      - "scripts/**"
      - ".github/workflows/android-release.yml"

  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "experts/**"
      - "scripts/**"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Release gate regression tests
        run: python3 -m unittest discover -s android/scripts -p 'test_release_gate.py' -v

      - name: Update check over the real network
        run: python3 android/scripts/check_update_net.py

      - name: Nebula lattice classifier
        run: node android/apk/app/src/main/assets/nebula/nebula-pixels.test.mjs

      - name: Reuse the 0.1.0 model manifest
        run: |
          set -eu
          curl -fL --retry 3 -o android/apk/app/src/main/assets/setup_manifest.json \
            https://github.com/${GITHUB_REPOSITORY}/releases/download/android-v0.1.0/manifest.json
          python3 -c 'import json; m=json.load(open("android/apk/app/src/main/assets/setup_manifest.json")); assert m["published"] and m["files"]'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK pieces
        run: |
          SDK=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          CMDLINE=$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | head -1)
          test -n "$CMDLINE"
          mkdir -p "$SDK/licenses"
          printf '%s\n' 24333f8a63b6825ea9c5514f83c2829b004d1fee d56f5187479451eabf01fb78af6dfcb131a6481e > "$SDK/licenses/android-sdk-license"
          "$CMDLINE" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build on-device LoRA trainer
        run: sh android/trainer/build_android.sh

      - name: Build cased bge libllama
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc libvulkan-dev
          sh android/qvac/build_android.sh
          test -f android/apk/app/src/main/jniLibs/arm64-v8a/libggml-vulkan.so
          test -f android/apk/app/src/main/jniLibs/arm64-v8a/libggml-cpu.so

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and signed debug APK
        working-directory: android/apk
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest pdfboxUnitTest assembleDebug --no-daemon --stacktrace

      - name: Write the update manifest
        run: |
          set -eu
          TAG=android-v0.1.34
          STAGE=android/out/release
          mkdir -p "$STAGE"
          APK=android/apk/app/build/outputs/apk/debug/app-debug.apk
          if unzip -p "$APK" 'classes*.dex' | grep -a -q 'e2e-draft.txt'; then
            echo "发布包里有 e2e-draft.txt，草稿注入不能出仪器测试包" >&2
            exit 1
          fi
          cp "$APK" "$STAGE/app-debug.apk"
          cp android/apk/app/src/main/assets/setup_manifest.json "$STAGE/manifest.json"
          SDK=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}
          AAPT=$(find "$SDK/build-tools" -path '*/aapt' | sort | tail -1)
          BADGING=$("$AAPT" dump badging "$STAGE/app-debug.apk")
          python3 - "$TAG" "$STAGE" "$BADGING" << 'PY'
          import hashlib, json, pathlib, sys
          tag, stage, badging = sys.argv[1:]
          name = tag.removeprefix("android-v")
          major, minor, patch = (int(part) for part in name.split("."))
          code = major * 1_000_000 + minor * 1_000 + patch
          assert f"versionCode='{code}'" in badging, badging
          assert f"versionName='{name}'" in badging, badging
          assert "native-code: 'arm64-v8a'" in badging, badging
          apk = pathlib.Path(stage) / "app-debug.apk"
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          payload = {
              "versionName": name,
              "versionCode": code,
              "sha256": digest,
              "size": apk.stat().st_size,
              "apk": "app-debug.apk",
          }
          (pathlib.Path(stage) / "update.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (pathlib.Path(stage) / "SHA256SUMS").write_text(f"{digest}  app-debug.apk\n", encoding="utf-8")
          print(payload)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: |
            android/out/release/app-debug.apk
            android/out/release/manifest.json
            android/out/release/update.json
            android/out/release/SHA256SUMS
          if-no-files-found: error

  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Nebula lattice classifier
        run: node android/apk/app/src/main/assets/nebula/nebula-pixels.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install emulator pieces
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip ffmpeg xvfb x11-utils libnss3 libx11-xcb1 libxcb-cursor0 libxkbcommon-x11-0 libxcomposite1 libxcursor1 libxi6 libxtst6 libxdamage1 libxrandr2 libpulse0
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2
          SDK=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          CMDLINE=$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | head -1)
          test -n "$CMDLINE"
          mkdir -p "$SDK/licenses"
          printf '%s\n' 24333f8a63b6825ea9c5514f83c2829b004d1fee d56f5187479451eabf01fb78af6dfcb131a6481e > "$SDK/licenses/android-sdk-license"
          "$CMDLINE" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;default;x86_64"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "没有 /dev/kvm" >&2; exit 1; fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Upgrade from the previous version keeps data
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: sh android/scripts/upgrade_preserve.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-e2e
          path: |
            android/out/upgrade/shots
            android/out/upgrade/emulator.log
          if-no-files-found: ignore

  inapp-update:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: android/out/release

      - name: Install emulator pieces
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip ffmpeg xvfb x11-utils libnss3 libx11-xcb1 libxcb-cursor0 libxkbcommon-x11-0 libxcomposite1 libxcursor1 libxi6 libxtst6 libxdamage1 libxrandr2 libpulse0
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2
          SDK=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          CMDLINE=$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | head -1)
          test -n "$CMDLINE"
          mkdir -p "$SDK/licenses"
          printf '%s\n' 24333f8a63b6825ea9c5514f83c2829b004d1fee d56f5187479451eabf01fb78af6dfcb131a6481e > "$SDK/licenses/android-sdk-license"
          "$CMDLINE" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "没有 /dev/kvm" >&2; exit 1; fi

      - name: Candidate installs through the production update path and preserves data
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: sh android/scripts/inapp_update_candidate.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inapp-update-candidate
          path: |
            android/out/inapp-candidate/*.json
            android/out/inapp-candidate/*.xml
            android/out/inapp-candidate/*.txt
            android/out/inapp-candidate/*.log
          if-no-files-found: ignore

  publish:
    needs: [build, upgrade, inapp-update]
    # PRs only validate. Every gate must succeed; failures/skips/cancellations block publishing.
    if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.upgrade.result == 'success' && needs.inapp-update.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 截图和星云录像要先看过，仓库里才会有 android/PUBLISH_OK。没有这个文件就不发标签。
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: android/out/release

      - name: Publish pre-release
        if: hashFiles('android/PUBLISH_OK') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG=android-v0.1.34
          STAGE=android/out/release
          python3 - << 'PY'
          import hashlib, json, pathlib
          stage = pathlib.Path("android/out/release")
          meta = json.loads((stage / "update.json").read_text())
          apk = (stage / "app-debug.apk").read_bytes()
          digest = hashlib.sha256(apk).hexdigest()
          assert meta["versionName"] == "0.1.34"
          assert meta["versionCode"] == 1034
          assert meta["sha256"] == digest
          assert meta["size"] == len(apk)
          sums = (stage / "SHA256SUMS").read_text().split()
          assert sums[0] == digest and sums[1] == "app-debug.apk"
          PY
          NOTES=$(cat << EOF
          - 修复聊天中明确纠正事实时显示「记住了」但仍回答旧值的问题。确认后立即使用新值，不需要重新训练；重启后仍生效。
          - 记忆库单独显示已确认的更正，不再把被更正的训练事实显示为当前值。删除训练专家不会连带删除单独确认的更正。
          - 从 0.1.33 可使用设置中的「检查更新」覆盖安装。签名和模型清单保持不变。

          这是 Android 预发布，不影响桌面版本。
          EOF
          )
          # Never replace an already published APK/tag when a main push reruns this version.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump the version for a new release." >&2
            exit 1
          fi
          gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" --title "Android 0.1.34" --notes "$NOTES" \
            "$STAGE/app-debug.apk" "$STAGE/manifest.json" "$STAGE/update.json" "$STAGE/SHA256SUMS"
          gh release edit "$TAG" --draft=false --prerelease
