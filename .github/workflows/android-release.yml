name: Android release

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/android-milestone-1-d325
    paths:
      - "android/**"
      - "experts/**"
      - "scripts/**"
      - ".github/workflows/android-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Reuse the 0.1.0 model manifest
        run: |
          set -eu
          curl -fL --retry 3 -o android/apk/app/src/main/assets/setup_manifest.json \
            https://github.com/${GITHUB_REPOSITORY}/releases/download/android-v0.1.0/manifest.json
          python3 -c 'import json; m=json.load(open("android/apk/app/src/main/assets/setup_manifest.json")); assert m["published"] and m["files"]'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK pieces
        run: |
          SDK=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          CMDLINE=$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | head -1)
          test -n "$CMDLINE"
          mkdir -p "$SDK/licenses"
          printf '%s\n' 24333f8a63b6825ea9c5514f83c2829b004d1fee d56f5187479451eabf01fb78af6dfcb131a6481e > "$SDK/licenses/android-sdk-license"
          "$CMDLINE" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build on-device LoRA trainer
        run: sh android/trainer/build_android.sh

      - name: Build cased bge libllama
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc libvulkan-dev
          sh android/qvac/build_android.sh
          test -f android/apk/app/src/main/jniLibs/arm64-v8a/libggml-vulkan.so
          test -f android/apk/app/src/main/jniLibs/arm64-v8a/libggml-cpu.so

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and signed debug APK
        working-directory: android/apk
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG=android-v0.1.3
          STAGE=android/out/release
          mkdir -p "$STAGE"
          cp android/apk/app/build/outputs/apk/debug/app-debug.apk "$STAGE/app-debug.apk"
          cp android/apk/app/src/main/assets/setup_manifest.json "$STAGE/manifest.json"
          NOTES=$(cat << EOF
          手机浏览器可以直接安装的调试包。第一次打开会自己下载基座、bge、训练权重和五个专家。

          模型和清单仍用 android-v0.1.0 里的文件,没有重新转换。对话、嵌入、路由和 GPU 自检跑在单独的 :llm 进程里,训练在 :train。原生崩溃不会把界面打回桌面;会记下信号和阶段,这块驱动记成坏后端,同一条请求改走 CPU 再试一次。Mali 在这次独立自检对上并且比 CPU 快之前,自动模式保持 CPU。Adreno 仍只看结果是否一致。

          界面和桌面客户端对齐:底栏四个页面,齿轮进设置(后端、Wi-Fi、清单、语言、导出诊断、空间、版本)。设置是不透的全屏。星云在手机上是能看清的粒子云,专家名字和事实卡能读,链接很淡,开场把所有专家放进画面。对话里的记忆备注加大了间距;图形后端改走 CPU 只弹出一次。巩固页顶部是阶段星座,抽出的事实是卡片。下载总量用 KB/MB/GB,刚开始不会显示「剩余 0 秒」。

          0.1.2 的进程隔离还在:星云复用桌面的 WebGL 银河和粒子云,可以缩放、点开事实、跳回来源对话,回忆时高亮。标题下不再放调试状态。

          - APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-debug.apk
          - 清单: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/manifest.json

          这是预发布,不合并到 main。
          EOF
          )
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Android 0.1.3" --notes "$NOTES"
          gh release upload "$TAG" "$STAGE/app-debug.apk" "$STAGE/manifest.json" --clobber
