name: Android release

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/android-milestone-1-d325
    paths:
      - "android/**"
      - "experts/**"
      - "scripts/**"
      - ".github/workflows/android-release.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Update check over the real network
        run: python3 android/scripts/check_update_net.py

      - name: Nebula lattice classifier
        run: node android/apk/app/src/main/assets/nebula/nebula-pixels.test.mjs

      - name: Reuse the 0.1.0 model manifest
        run: |
          set -eu
          curl -fL --retry 3 -o android/apk/app/src/main/assets/setup_manifest.json \
            https://github.com/${GITHUB_REPOSITORY}/releases/download/android-v0.1.0/manifest.json
          python3 -c 'import json; m=json.load(open("android/apk/app/src/main/assets/setup_manifest.json")); assert m["published"] and m["files"]'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK pieces
        run: |
          SDK=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          CMDLINE=$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | head -1)
          test -n "$CMDLINE"
          mkdir -p "$SDK/licenses"
          printf '%s\n' 24333f8a63b6825ea9c5514f83c2829b004d1fee d56f5187479451eabf01fb78af6dfcb131a6481e > "$SDK/licenses/android-sdk-license"
          "$CMDLINE" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build on-device LoRA trainer
        run: sh android/trainer/build_android.sh

      - name: Build cased bge libllama
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc libvulkan-dev
          sh android/qvac/build_android.sh
          test -f android/apk/app/src/main/jniLibs/arm64-v8a/libggml-vulkan.so
          test -f android/apk/app/src/main/jniLibs/arm64-v8a/libggml-cpu.so

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and signed debug APK
        working-directory: android/apk
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Write the update manifest
        run: |
          set -eu
          TAG=android-v0.1.20
          STAGE=android/out/release
          mkdir -p "$STAGE"
          APK=android/apk/app/build/outputs/apk/debug/app-debug.apk
          if unzip -p "$APK" 'classes*.dex' | grep -a -q 'e2e-draft.txt'; then
            echo "发布包里有 e2e-draft.txt，草稿注入不能出仪器测试包" >&2
            exit 1
          fi
          cp "$APK" "$STAGE/app-debug.apk"
          cp android/apk/app/src/main/assets/setup_manifest.json "$STAGE/manifest.json"
          SDK=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}
          AAPT=$(find "$SDK/build-tools" -path '*/aapt' | sort | tail -1)
          BADGING=$("$AAPT" dump badging "$STAGE/app-debug.apk")
          python3 - "$TAG" "$STAGE" "$BADGING" << 'PY'
          import hashlib, json, pathlib, sys
          tag, stage, badging = sys.argv[1:]
          name = tag.removeprefix("android-v")
          major, minor, patch = (int(part) for part in name.split("."))
          code = major * 1_000_000 + minor * 1_000 + patch
          assert f"versionCode='{code}'" in badging, badging
          assert f"versionName='{name}'" in badging, badging
          assert "native-code: 'arm64-v8a'" in badging, badging
          apk = pathlib.Path(stage) / "app-debug.apk"
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          payload = {
              "versionName": name,
              "versionCode": code,
              "sha256": digest,
              "size": apk.stat().st_size,
              "apk": "app-debug.apk",
          }
          (pathlib.Path(stage) / "update.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (pathlib.Path(stage) / "SHA256SUMS").write_text(f"{digest}  app-debug.apk\n", encoding="utf-8")
          print(payload)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: |
            android/out/release/app-debug.apk
            android/out/release/manifest.json
            android/out/release/update.json
            android/out/release/SHA256SUMS
          if-no-files-found: error

  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Nebula lattice classifier
        run: node android/apk/app/src/main/assets/nebula/nebula-pixels.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install emulator pieces
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip ffmpeg xvfb x11-utils libnss3 libx11-xcb1 libxcomposite1 libxcursor1 libxi6 libxtst6 libxdamage1 libxrandr2 libpulse0
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2
          SDK=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          CMDLINE=$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | head -1)
          test -n "$CMDLINE"
          mkdir -p "$SDK/licenses"
          printf '%s\n' 24333f8a63b6825ea9c5514f83c2829b004d1fee d56f5187479451eabf01fb78af6dfcb131a6481e > "$SDK/licenses/android-sdk-license"
          "$CMDLINE" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;aosp_atd;x86_64"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "没有 /dev/kvm" >&2; exit 1; fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Upgrade from the previous version keeps data
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: sh android/scripts/upgrade_preserve.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-e2e
          path: |
            android/out/upgrade/shots
            android/out/upgrade/emulator.log
          if-no-files-found: ignore

  inapp-update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Lumi 已核对运行 40342688527：已发布的 0.1.4 在应用里升到 0.1.5。
    # 0.1.4 仍会访问没有 DNS 的 mirror.ghproxy.com，重跑可能再次失败。这不应挡住 0.1.9。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install emulator pieces
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip ffmpeg xvfb x11-utils libnss3 libx11-xcb1 libxcomposite1 libxcursor1 libxi6 libxtst6 libxdamage1 libxrandr2 libpulse0
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2
          SDK=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          CMDLINE=$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | head -1)
          test -n "$CMDLINE"
          mkdir -p "$SDK/licenses"
          printf '%s\n' 24333f8a63b6825ea9c5514f83c2829b004d1fee d56f5187479451eabf01fb78af6dfcb131a6481e > "$SDK/licenses/android-sdk-license"
          "$CMDLINE" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "没有 /dev/kvm" >&2; exit 1; fi

      - name: Published 0.1.4 checks for updates and installs 0.1.5
        run: sh android/scripts/inapp_update_014_to_015.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inapp-update-014
          path: |
            android/out/inapp-update/shots
            android/out/inapp-update/*.txt
            android/out/inapp-update/emulator.log
          if-no-files-found: ignore

  publish:
    needs: [build, upgrade, inapp-update]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 截图和星云录像要先看过，仓库里才会有 android/PUBLISH_OK。没有这个文件就不发标签。
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: android/out/release

      - name: Publish pre-release
        if: hashFiles('android/PUBLISH_OK') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG=android-v0.1.20
          STAGE=android/out/release
          python3 - << 'PY'
          import hashlib, json, pathlib
          stage = pathlib.Path("android/out/release")
          meta = json.loads((stage / "update.json").read_text())
          apk = (stage / "app-debug.apk").read_bytes()
          digest = hashlib.sha256(apk).hexdigest()
          assert meta["versionName"] == "0.1.20"
          assert meta["versionCode"] == 1020
          assert meta["sha256"] == digest
          assert meta["size"] == len(apk)
          sums = (stage / "SHA256SUMS").read_text().split()
          assert sums[0] == digest and sums[1] == "app-debug.apk"
          PY
          NOTES=$(cat << EOF
          0.1.20 让巩固页一次训练全部待巩固。两条关于你的事实，例如猫的名字和你的名字，写进同一个「关于你」。点「全部训练」就一起开始。训练进行中再点另一条，会排进后面，不会把正在跑的任务换掉。每一条显示排队中、训练中、已完成或失败。取消会停掉整批。

          0.1.19 修巩固训练时的两组按钮。事实卡片和页面底部各有一组「确认并训练」「取消训练」，损失图被夹在中间。训练进行中卡片里不再放按钮，进度和损失图在上面，只在底部留一组。

          0.1.18 修两处。设置里检查更新时，说明和「正在下载」单独成块，不再盖住下面的字。连续教两条事实后，巩固页把两条都列出来，可以分别确认并训练，训练完一条另一条还在。

          0.1.17 把对话、巩固、记忆库和设置改成安静的炭黑画布。助手的话直接铺在页面上，用户的话是浅色圆角。输入栏是实心圆角条，有字才亮起发送。来源知识是回答下面的一枚小标记。设置按卡片分组。星云仍是整页星空。教事实、助手口吻、取消训练和加载模型与 0.1.16 相同。

          0.1.16 把四个页面收成同一套银河界面。标题和标签用衬线，对话、星云、巩固、记忆库和设置都铺在有层次的星空上。对话图标改成气泡，底栏选中有标记。输入栏、气泡和「来源知识」按对话来设计。基座和 bge 的状态只留在设置里。教过的事实、助手口吻的回忆、取消训练、加载模型时不被三分钟掐掉、应用内更新，都和 0.1.15 一样。

          0.1.15 修回忆个人事实时用了用户的口吻。问「我的猫猫是什么」，记忆对上了，来源仍写「来源知识」，但回复是「我的猫猫叫咪咪。」，像助手自己是用户。关于你的事实仍按原话保存，回答时改成对用户说话：「你的猫猫叫咪咪。」「我是徐金朔」回答成「你是徐金朔。」公司事实不变。

          0.1.14 修巩固失败后无法取消。失败文案写着点「取消训练」，但按钮在事实卡片里；卡片在陈述句清空后不再显示，界面只剩失败和一条旧的损失曲线。现在失败和加载过程中，确认并训练、取消训练都钉在巩固页底部。取消会停掉训练进程，清掉失败状态和曲线，回到可以继续用的巩固页。重试会再用上一次的任务。

          0.1.14 也改了停在「[facts] rows=20」的三分钟失败。[facts] 只表示样本已经分词，后面还在安静地加载模型。内存还在涨就继续等，并写「正在加载模型」。内存和输出都停了三分钟，才记成「加载模型没有进展」，可以重试或取消。已经进入微批之后，三分钟没有新输出仍会失败。

          0.1.13 修对话文件被读成空内容时应用崩溃。保存对话时先把原文件截断再写入，回复线程正在写、界面又按刷新重读，就会读到空文件，JSONObject 抛出 End of input at character 0，PhoneApp 退出。现在先写入临时文件再换上，空文件或坏掉的 JSON 当成没有这则对话，不再崩溃。

          0.1.12 修巩固测试里问「我的猫叫什么名字？」时屏幕上没有咪咪。第 4/4 步在专家写盘之前就出现，测试把它当成训练结束，问句赶在登记之前发出，记忆里还没有这只猫。现在进度在登记之后才写「已完成 · 已登记」，测试等到这一行再问。

          0.1.11 修 vivo 上自动模式被 ensure 阶段的进程退出锁在 CPU。诊断里 GPU 解码 26.5 比 CPU 的 13.9 快，Vulkan 库也在，但 :llm 在启动自检时消失，没有原生信号，只记成 ensure / vulkan / binder。这种退出记两次就被写成 native_crash，已经测过更快的 GPU 不再使用。现在启动时没有原生信号的退出不计入停用，测速更快的结果留在 Vulkan。提示写明 stage=ensure。设置里把图形后端改成自动仍会清掉记录再测。

          0.1.11 也让「你好 我是徐金朔」写进诊断的 last-route。这句话直接回「好的，记住了，你是徐金朔。」，实体是「我」，专家是关于你，原因是 teach。以前记下成功时不写 last-route，诊断里会留下更早一次走 bge 的记录。

          0.1.10 修巩固页训练时底下的两条线。上面那条是正弦波，不是损失；下面那条把损失的最高和最低拉满整张图，所以很小的起伏也变成折线。现在只画这一次训练打出的逐步损失，从 0 往上量，并写上「损失」和当前数值。第一步还在算、还没有 loss 时，不再画那条波。

          0.1.9 修的是对话用的 Vulkan，不是星云。换版本号时，已经在这台 Mali 上证明比 CPU 快的结果被当成没测过，打开应用会重新自检。自检进程崩一次就弹出「图形后端异常，已改用 CPU」，并且以后不再试 GPU。这一版同一套图形策略沿用上次的结果，不会因为版本号再测一遍。自检如果退出，会立刻再测一次；还失败才改用 CPU，下次打开再试 GPU。连续两次失败才固定用 CPU。提示里写明是自检还是生成，以及信号。设置里把图形后端改成自动，会清掉失败记录再测。

          0.1.9 也修了描述知识时把原话复述一遍。以前只有少数句式会记下，其余陈述交给基座，基座的提示只有「你是助手」和「请简短回答」，于是把用户刚说的话换个说法再说出来。对上的句子也会在「记住了」后面把整句再贴一遍。现在「你好 我是徐金朔」记成实体「我」、名字，星云仍显示「关于你」。回复是「好的，记住了，你是徐金朔。」，是在对用户说话，不再自称徐金朔。这句话下面写「已记下，待巩固」，不再写「未使用记忆」。「某公司成立于某年」和紧跟着的「总部在某地」记成该公司的事实，回复只说「好的，记住了。」。猫的名字那句确认保持「好的，记住了，你的猫叫咪咪。」问句、hello，以及「告诉我某公司相关信息」这种开放问题，仍按原来的方式回答，不会被当成新事实。

          0.1.8 把星云缩到最小、回到开场取景时再压暗。云团和事实星按屏幕像素来画，相机拉远时它们不会跟着变小。好几朵云挤在一小块画面里，最亮的核心和光刺叠在一起，中心变成纯白。这一版只在开场那一帧收掉那些最亮的核心粒子，并把光刺压下去。放大看同一朵云时，亮度和大小与 0.1.7 相同。

          0.1.7 把星云压暗，并让放大之后能缩回开场画面。原先云团和银河叠色太亮。缩小的最远距离被写死成 90，而竖屏上好几个专家的开场距离往往超过 200，所以放大之后缩不回原来的取景。点进一朵云还会把距离收到 22，相机转到云的背面。现在最远可以回到开场那一帧，双指张开和捏合都走这个范围。关于自己的事实（实体仍是「我」，这样「我的猫叫什么」还能对上）收进稳定的「关于你」，下一次巩固会把以前单独成团的「我」并进去。

          0.1.7 也修了巩固页训练时的进度线。原先两条一样的金色粗线叠在一起：步数 2/8 和轮次 1/4 都是四分之一，看起来像同一条线画了两次。同一屏上面写第 2/8 步、第 1/4 轮，页脚又写 micro 6/8、step 3/8。现在只留一条进度线，按已经打出 loss 的步，加上正在算的微批来填充。同一行写成第 3/8 步、微批 6/8、第 2/4 轮，损失、已过时间和剩余时间还在。页脚不再贴训练进程的英文日志。

          已经装了 0.1.19、0.1.18、0.1.17、0.1.16、0.1.15、0.1.14、0.1.13、0.1.12、0.1.11、0.1.10、0.1.9、0.1.8、0.1.7 或 0.1.6 的手机，可以在应用里点「检查更新」。还停在 0.1.4 的手机，这一次请用手机浏览器打开下面的 APK 安装。0.1.4 里的「检查更新」还是旧地址，连不上 GitHub 时升不到这一版。签名和 0.1.4、0.1.5、0.1.6、0.1.7、0.1.8 是同一把测试钥匙，不用卸载，模型和对话留着。

          手机浏览器可以直接安装的调试包。第一次打开会自己下载基座、bge、训练权重和五个专家。

          0.1.6 修了设置里的「检查更新」。直连 GitHub 失败会继续试 gh-proxy.com、gh-proxy.org、ghfast.top、gh.llkk.cc 和 gh.nxnow.top。HTML 落地页会被跳过。发布列表失败时，按 android-v0.1.5、android-v0.1.6、android-v0.1.7 这样的标签去读 update.json，不读 releases/latest。ghproxy.net 超时、mirror.ghproxy.com 没有 DNS，不再使用。连不上时界面用中文说明，并给出这一版的安装包和发布页。设置页里直接有「下载并安装」，不用先关掉设置。

          0.1.5 修了真机上星云背景变成整屏棕色格子噪点的问题。银河着色器改用高精度和不会溢出的散列，粒子改成面向相机的四边形，直接画进 8 位帧缓冲，不再经过半精度离屏目标和点精灵。画面若仍被判成格子噪点，就在同一页改画 canvas 星云，专家标签和事实卡还在。

          0.1.5 也修了巩固停在「这一步还在计算」。vivo X200 Pro 上这一步停了大约 41 分钟，页面只剩 Dataset 那一行（epochs=4 max_steps=8），步数和 loss 都没有。训练进程已经把数据集行打出来了，卡住的是后面第一次矩阵乘：OpenBLAS 交叉编译时按 Linux 打开了绑核，在手机上 sched_setaffinity 会把工作线程停住。这一版编译关掉绑核，每个微批开始就写出「第 1/8 步 · 微批 1/8」。超过 3 分钟没有新输出就记成失败，可以点「确认并训练」重试，或点「取消训练」。

          从 0.1.4 起，安装包用同一把测试钥匙签名。0.1.20 的「检查更新」读 android-v* 发布和 update.json，不读 releases/latest。GitHub 失败再试上面的镜像；发布列表拿不到就按更新的标签读 update.json。下载可以续传并核对 SHA256，然后用系统安装器覆盖安装。模型和对话留在原地；清单里 SHA256 没变的模型文件不会重新下载。已经装了 0.1.4 的手机，这一次用浏览器安装，不要指望 0.1.4 自己检查更新。已经装了 0.1.6、0.1.7、0.1.8、0.1.9、0.1.10、0.1.11、0.1.12、0.1.13、0.1.14、0.1.15、0.1.16、0.1.17、0.1.18 或 0.1.19 的手机用应用里的检查更新即可。

          0.1.2、更早的包，以及标签上那份旧的 0.1.3，都是每次 CI 一把新的调试钥匙，签不上这一版。已经装过那些包的手机要先卸一次。卸载会清掉应用私有目录和 Android/data 里的模型、专家、对话和设置，下次打开会按 0.1.0 的清单重新下载。卸完装上这一版之后，以后的版本可以在应用里直接更新，不用再卸。

          模型和清单仍用 android-v0.1.0 里的文件,没有重新转换。对话、嵌入、路由和 GPU 自检跑在单独的 :llm 进程里,训练在 :train。原生崩溃不会把界面打回桌面;会记下信号和阶段,这块驱动记成坏后端,同一条请求改走 CPU 再试一次。Mali 在这次独立自检对上并且比 CPU 快之前,自动模式保持 CPU。Adreno 仍只看结果是否一致。

          界面和桌面客户端对齐:底栏四个页面,齿轮进设置(后端、Wi-Fi、清单、语言、导出诊断、检查更新、空间、版本,高级里才有导入专家和路由自检)。设置是不透的全屏。星云在手机上是能看清的粒子云,专家名字和事实卡能读,链接很淡,开场把所有专家放进画面。对话里的记忆备注加大了间距;图形后端改走 CPU 只弹出一次。巩固页顶部是阶段星座:抽取事实、写闸门、生成样本、训练 LoRA、回忆检查、注册专家。抽出的事实是卡片,问句和回答会自动填上。训练在前台服务里跑,通知和页面每秒更新步数、轮次、损失和剩余时间;第一步还在算时显示已过秒数,不再停在「损失 · 0 步」。下载总量用 KB/MB/GB,刚开始不会显示「剩余 0 秒」。

          输入栏跟着键盘上移,键盘打开时底栏先收起来。生成时是会动的圆点,第一个词超过 3 秒会显示已等待多久,随后字是一个一个出来的。陈述句会回一句「记住了」,不会只把名字扔回来。记下来还没巩固的事实在记忆库的「待巩固」里。问到已经记下的实体,例如「告诉我佐雷公司相关信息」,直接用库里的事实回答,不再让基座另编一个年份;问到库里没有的那一项时,只说已知的,并写明其余不在记忆里。导出诊断里带上一次路由有没有命中。

          0.1.2 的进程隔离还在。

          - APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-debug.apk
          - 清单: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/manifest.json
          - 更新说明: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/update.json

          这是预发布,不合并到 main。签名是仓库里的测试钥匙,不是上架密钥。
          EOF
          )
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Android 0.1.20" --notes "$NOTES"
          gh release upload "$TAG" "$STAGE/app-debug.apk" "$STAGE/manifest.json" "$STAGE/update.json" "$STAGE/SHA256SUMS" --clobber
