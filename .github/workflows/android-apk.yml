name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK pieces
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' 24333f8a63b6825ea9c5514f83c2829b004d1fee d56f5187479451eabf01fb78af6dfcb131a6481e > "$ANDROID_HOME/licenses/android-sdk-license"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build on-device LoRA trainer
        run: sh android/trainer/build_android.sh

      - name: Fetch QVAC arm64 binaries
        working-directory: android/apk
        run: sh download_qvac.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and signed debug APK
        working-directory: android/apk
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: lorabge-memory-arm64-debug
          path: android/apk/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
