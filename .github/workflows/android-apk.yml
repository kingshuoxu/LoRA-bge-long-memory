name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK pieces
        run: |
          SDK=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          CMDLINE=$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | head -1)
          test -n "$CMDLINE"
          mkdir -p "$SDK/licenses"
          printf '%s\n' 24333f8a63b6825ea9c5514f83c2829b004d1fee d56f5187479451eabf01fb78af6dfcb131a6481e > "$SDK/licenses/android-sdk-license"
          "$CMDLINE" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build on-device LoRA trainer
        run: sh android/trainer/build_android.sh

      - name: Build cased bge libllama
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc libvulkan-dev
          sh android/qvac/build_android.sh
          test -f android/apk/app/src/main/jniLibs/arm64-v8a/libggml-vulkan.so
          test -f android/apk/app/src/main/jniLibs/arm64-v8a/libggml-cpu.so
          echo "Vulkan and dotprod/i8mm CPU libllama are in the APK"

      - name: Note software Vulkan
        run: |
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-tools || true
          vulkaninfo --summary > /tmp/vulkaninfo.txt || true
          if grep -Ei 'llvmpipe|lavapipe' /tmp/vulkaninfo.txt; then
            echo "Software Vulkan is installed. A full CPU-versus-Vulkan llama compare is not run here: the phone binary is arm64 and this job has no GGUF. The Mali branch is covered by android/qvac/test_mali_policy.cpp."
          else
            echo "No lavapipe/llvmpipe ICD. The Mali branch is covered by android/qvac/test_mali_policy.cpp, which build_android.sh already ran."
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and signed debug APK
        working-directory: android/apk
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: lorabge-memory-arm64-debug
          path: android/apk/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
