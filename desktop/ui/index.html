<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LoRA 长记忆</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="boot" class="boot">
    <div>
      <h1>LoRA 长记忆</h1>
      <p id="boot-text">正在准备本地模型…</p>
      <p class="muted">首次运行会下载 Qwen2.5-0.5B-Instruct 和 bge-small-zh-v1.5，大约 1.1 GB，只下载一次。</p>
    </div>
  </div>
  <div id="app" class="app" hidden>
    <aside class="side">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div>
          <strong>LoRA 长记忆</strong>
          <div class="muted" id="device-label">本地</div>
        </div>
      </div>
      <div class="side-actions">
        <button id="new-chat" type="button">新对话</button>
        <button id="consolidate" type="button">巩固所选</button>
        <button id="memory-tab" type="button">记忆库</button>
      </div>
      <div id="conv-list" class="conv-list"></div>
    </aside>
    <main>
      <header class="top">
        <h2 id="title">新对话</h2>
        <div id="jobbar" class="jobbar" hidden></div>
      </header>
      <section id="chat-view">
        <div id="messages" class="messages"></div>
        <form id="composer" class="composer">
          <textarea id="input" rows="3" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
          <button id="send" type="submit">发送</button>
        </form>
      </section>
      <section id="memory-view" hidden></section>
    </main>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title">巩固成记忆</h3>
      <p class="muted">核对抽取出的事实。可以改陈述、问题和答案，取消勾选不想写入的条目，再开始训练。</p>
      <div id="fact-list" class="fact-list"></div>
      <div class="sheet-actions">
        <button id="modal-close" type="button">关闭</button>
        <button id="modal-commit" type="button">开始巩固</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
