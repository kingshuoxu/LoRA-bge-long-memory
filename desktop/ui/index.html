<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LoRA 长记忆</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-card">
      <div class="orb" aria-hidden="true"></div>
      <h1>LoRA 长记忆</h1>
      <p id="boot-text">正在准备本地模型…</p>
      <p class="muted">首次运行会下载 Qwen2.5-0.5B-Instruct 和 bge-small-zh-v1.5，大约 1.1 GB，只下载一次。</p>
    </div>
  </div>
  <div id="app" class="app" hidden>
    <aside class="side">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div>
          <strong>LoRA 长记忆</strong>
          <div class="muted" id="device-label">本地</div>
        </div>
      </div>
      <nav class="side-actions" aria-label="视图">
        <button id="nav-chat" type="button" class="nav active">对话</button>
        <button id="nav-consolidate" type="button" class="nav">巩固</button>
        <button id="nav-nebula" type="button" class="nav">星云</button>
        <button id="memory-tab" type="button" class="nav">记忆库</button>
      </nav>
      <div class="side-actions secondary">
        <button id="new-chat" type="button">新对话</button>
        <button id="consolidate" type="button" class="primary">巩固所选</button>
      </div>
      <div id="conv-list" class="conv-list"></div>
    </aside>
    <main>
      <header class="top">
        <div>
          <p class="eyebrow" id="eyebrow">对话</p>
          <h2 id="title">新对话</h2>
        </div>
        <div id="jobbar" class="jobbar" hidden></div>
      </header>
      <section id="chat-view">
        <div id="messages" class="messages"></div>
        <form id="composer" class="composer">
          <textarea id="input" rows="3" placeholder="输入消息。若要改一条已经记住的事实，直接说出新的取值。Enter 发送，Shift+Enter 换行"></textarea>
          <button id="send" type="submit">发送</button>
        </form>
      </section>
      <section id="consolidate-view" hidden>
        <div class="stage-layout">
          <ol id="stage-list" class="stage-list"></ol>
          <div class="stage-panel">
            <div id="loss-card" class="loss-card" hidden></div>
            <div id="stage-feed" class="stage-feed"></div>
            <div id="fact-editor" hidden>
              <div id="fact-list" class="fact-list"></div>
              <div class="sheet-actions">
                <button id="editor-commit" type="button" class="primary">开始巩固</button>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section id="nebula-view" hidden>
        <div class="nebula-wrap">
          <canvas id="nebula-canvas"></canvas>
          <div id="nebula-tip" class="nebula-tip" hidden></div>
          <div id="nebula-empty" class="nebula-empty" hidden>还没有巩固过的记忆。先在对话里留下事实，再点「巩固所选」。</div>
        </div>
      </section>
      <section id="memory-view" hidden></section>
    </main>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title">细节</h3>
      <div id="modal-body"></div>
      <div class="sheet-actions">
        <button id="modal-close" type="button">关闭</button>
        <button id="modal-commit" type="button" class="primary">确认</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
